name: Build Tauri Windows (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar .exe para Windows
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Rust toolchain estable
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de compilación Rust (Cargo)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compilar frontend con Vite
        run: npm run build

      - name: Compilar app de Tauri (.exe / .msi)
        run: npm run tauri:build

      - name: Subir instaladores como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ferreteria-pro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30